<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070516"/>
      <stop offset="58%" stop-color="#19083a"/>
      <stop offset="100%" stop-color="#0b041c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a9d"/>
      <stop offset="55%" stop-color="#ff5e6c"/>
      <stop offset="100%" stop-color="#ffb830"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2a9d"/>
    </linearGradient>
    <clipPath id="sunClip">
      <circle cx="256" cy="222" r="118"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Horizon glow -->
  <ellipse cx="256" cy="296" rx="220" ry="44" fill="#ff2a9d" opacity="0.24"/>
  <!-- Striped Synthwave Sun -->
  <g clip-path="url(#sunClip)">
    <circle cx="256" cy="222" r="118" fill="url(#sun)"/>
    <rect x="120" y="246" width="272" height="10" fill="#19083a"/>
    <rect x="120" y="268" width="272" height="13" fill="#19083a"/>
    <rect x="120" y="294" width="272" height="16" fill="#19083a"/>
    <rect x="120" y="322" width="272" height="20" fill="#19083a"/>
  </g>
  <!-- Horizon line -->
  <line x1="36" y1="304" x2="476" y2="304" stroke="#00f0ff" stroke-width="5" opacity="0.85"/>
  <!-- Perspective Neon Road -->
  <polygon points="222,304 290,304 416,464 96,464" fill="#09051a"/>
  <line x1="222" y1="304" x2="96" y2="464" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="290" y1="304" x2="416" y2="464" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="316" x2="256" y2="454" stroke="url(#road)" stroke-width="6" stroke-dasharray="18 16" stroke-linecap="round"/>
  <!-- Outer cyber rim -->
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="4"/>
</svg>
